plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'idea'
}

def isInGHA = System.getenv("GITHUB_ACTIONS") == "true"
def gitCommitHash = { ->
    try {
        def r = providers.exec {
            commandLine = ['git', 'rev-parse', '--short', 'HEAD']
            ignoreExitValue = true
        }
        r.getResult().get().getExitValue() == 0 ? r.standardOutput.asText.get().strip() : "<UnknownCommit>"
    } catch (Exception ignored) { "<UnknownCommit>" }
}
def buildtime = { (long) (System.currentTimeMillis() / 1000) }

version = mod_version
group = mod_group_id
base { archivesName = archives_base_name }

repositories {
    mavenLocal()
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
    exclusiveContent {
        forRepository { maven { name = "caffeine"; url = "https://maven.flashyreese.me/releases" } }
        filter { includeGroup "net.caffeinemc" }
    }
    exclusiveContent {
        forRepository {
            ivy {
                name = "githubIvy"
                url = "https://github.com/"
                patternLayout { artifact '/[organisation]/[module]/releases/download/[revision]/[module]-[revision]-[classifier].[ext]' }
                metadataSources { artifact() }
            }
        }
        filter { includeModuleByRegex("[^\\.]+", "nvidium") }
    }
    maven { url = "https://maven.flashyreese.me/releases" }
    maven { url = "https://maven.flashyreese.me/snapshots" }
    mavenCentral()
}

sourceSets {
    java21 { java.srcDirs = ['src/java21/java'] ; compileClasspath += sourceSets.main.output }
    sodiumLegacy { java.srcDirs = ['src/sodiumLegacy/java'] }
}

def targetJava = 21
java.toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = targetJava
    options.deprecation = true
}

configurations {
    /** Full Modrinth Sodium NeoForge file (may be a bootstrap jar with nested mod JAR in 0.8+). */
    sodiumBootstrap
    sodiumBootstrap.setCanBeResolved(true)
    sodiumBootstrap.setCanBeConsumed(false)
    /** Sodium 0.6.x — compile legacy option GUI + mixin only (avoids duplicate classes vs 0.8 on main classpath). */
    sodium06ForLegacyCompile
    sodium06ForLegacyCompile.setCanBeResolved(true)
    sodium06ForLegacyCompile.setCanBeConsumed(false)
    voxyEmbed
    voxyEmbed.setCanBeResolved(true)
    voxyEmbed.setCanBeConsumed(false)
    // Raw sqlite-jdbc is shadow-relocated to avoid JPMS export clashes with other mods
    // (e.g. grieflogger) that also embed org.sqlite.* in their automatic module.
    sqliteToRelocate
    sqliteToRelocate.setCanBeResolved(true)
    sqliteToRelocate.setCanBeConsumed(false)
    runtimeClasspath.extendsFrom localRuntime
    implementation.extendsFrom voxyEmbed
}

def modLocal = { c -> if (!isInGHA) dependencies { localRuntime c } }

dependencies {
    implementation "io.github.llamalad7:mixinextras-neoforge:0.4.1"
    compileOnly "io.github.llamalad7:mixinextras-neoforge:0.4.1"
    annotationProcessor "io.github.llamalad7:mixinextras-neoforge:0.4.1"

    voxyEmbed "redis.clients:jedis:5.1.0"
    voxyEmbed "org.rocksdb:rocksdbjni:10.2.1"
    voxyEmbed "org.apache.commons:commons-pool2:2.12.0"
    // lz4-java: do not bundle (neither fat-jar nor Jar-in-Jar). Minecraft + NeoForge already ship
    // org.lz4:lz4-java on the game module path; embedding a second copy causes JPMS errors such as
    // "reads more than one module named org.lz4.java" (e.g. with Sodium's service layer).
    compileOnly "org.lz4:lz4-java:1.8.0"
    voxyEmbed "org.tukaani:xz:1.10"
    if (!isInGHA) { sqliteToRelocate "org.xerial:sqlite-jdbc:3.49.1.0" }
    // lwjgl base jar: do not embed. Minecraft + NeoForge already ship org.lwjgl:lwjgl on the
    // game module path. Bundling a second copy causes JPMS split-package errors such as
    // "Modules voxy and org.lwjgl export package org.lwjgl.system.windows to module
    // mixinextras.neoforge". Base LWJGL natives are also already extracted to java.library.path.
    // We only embed the LMDB/ZSTD addon jars (and their natives) which are NOT shipped by Minecraft.
    def lwjglV = project.findProperty("lwjgl_embed_version") ?: "3.3.3"
    compileOnly platform("org.lwjgl:lwjgl-bom:${lwjglV}")
    compileOnly "org.lwjgl:lwjgl"
    voxyEmbed "org.lwjgl:lwjgl-lmdb:${lwjglV}"
    voxyEmbed "org.lwjgl:lwjgl-zstd:${lwjglV}"
    voxyEmbed "org.lwjgl:lwjgl-lmdb:${lwjglV}:natives-windows"
    voxyEmbed "org.lwjgl:lwjgl-zstd:${lwjglV}:natives-windows"
    voxyEmbed "org.lwjgl:lwjgl-lmdb:${lwjglV}:natives-linux"
    voxyEmbed "org.lwjgl:lwjgl-zstd:${lwjglV}:natives-linux"

    sodiumBootstrap "maven.modrinth:sodium:${sodium_modrinth_version}"
    modLocal "maven.modrinth:sodium:${sodium_modrinth_version}"
    sodium06ForLegacyCompile "maven.modrinth:sodium:${sodium_legacy_modrinth_version}"
    compileOnly "maven.modrinth:iris:${iris_modrinth_version}"
    modLocal "maven.modrinth:iris:${iris_modrinth_version}"
    modLocal "io.github.douira:glsl-transformer:2.0.1"
    modLocal "org.anarres:jcpp:1.4.14"
    // CaffeineConfig's POM declares fabric-loader (Fabric Sodium); not used on NeoForge dev runs.
    if (!isInGHA) {
        dependencies {
            localRuntime("net.caffeinemc:CaffeineConfig:1.3.0+1.17") {
                exclude group: "net.fabricmc", module: "fabric-loader"
            }
        }
    }
    // Lithium API (LithiumHashPalette) — same types when present on class path; optional at runtime on Neo
    compileOnly "maven.modrinth:lithium:${lithium_modrinth_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation(sourceSets.main.output)
    testImplementation(files(sourceSets.main.compileClasspath))
}

def sodiumModClassesJar = layout.buildDirectory.file("generated/sodiumModForCompile/sodium-mod.jar")

/** Sodium 0.8+ Modrinth NeoForge JAR is a bootstrap; compile against the nested *-mod.jar when present. */
def unpackSodiumModJar = tasks.register("unpackSodiumModJar") {
    def bootFile = configurations.sodiumBootstrap.singleFile
    inputs.file(bootFile)
    outputs.file(sodiumModClassesJar)

    doLast {
        def out = sodiumModClassesJar.get().asFile
        out.parentFile.mkdirs()
        def nested = zipTree(bootFile).matching { include "META-INF/jarjar/*sodium*mod.jar" }.files
        if (!nested.isEmpty()) {
            java.nio.file.Files.copy(nested.iterator().next().toPath(), out.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        } else {
            java.nio.file.Files.copy(bootFile.toPath(), out.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.withType(JavaCompile).configureEach { dependsOn unpackSodiumModJar }

dependencies {
    compileOnly files(sodiumModClassesJar).builtBy(unpackSodiumModJar)
}

tasks.named('compileSodiumLegacyJava', JavaCompile).configure {
    dependsOn compileJava, unpackSodiumModJar
    options.encoding = 'UTF-8'
    options.release = targetJava
    options.deprecation = true
    classpath = sourceSets.main.compileClasspath.filter { f -> f.name != 'sodium-mod.jar' } +
            sourceSets.main.output +
            files(configurations.sodium06ForLegacyCompile.singleFile)
    options.annotationProcessorPath = configurations.annotationProcessor
}

tasks.named('test') {
    useJUnitPlatform()
}

// NeoForge / Minecraft — ModDev 2
neoForge {
    version = project.neo_version
    validateAccessTransformers = true
    accessTransformers = project.files("src/main/resources/META-INF/accesstransformer.cfg")

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
            jvmArguments.add "-Dsodium.checks.issue2561=false"
        }
        server { server() }
        data {
            data()
            programArguments.addAll "--mod", project.mod_id, "--all",
                    "--output", file("src/generated/resources/").absolutePath,
                    "--existing", file("src/main/resources/").absolutePath
        }
        configureEach {
            systemProperty "forge.logging.markers", "REGISTRIES"
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def h = gitCommitHash()
    def t = buildtime()
    def p = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        commit                 : h,
        buildtime              : t,
    ]
    inputs.properties p
    expand p
    from "src/main/templates"
    into layout.buildDirectory.dir("generated/sources/modMetadata")
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.register("compileJava21", JavaCompile) {
    dependsOn(tasks.compileJava)
    source = sourceSets.java21.java
    classpath = sourceSets.java21.compileClasspath
    destinationDirectory = layout.buildDirectory.dir("classes/java21")
    options.release = 21
}

def rocksBad = { f ->
    if (!f.endsWith('.so')) return f.endsWith('.jnilib')
    ["musl", "s390x", "riscv64", "ppc64le", "linux32", "aarch64", "linux-x86"].any { f.toLowerCase().contains(it) }
    || f.contains("osx")
}

def rocksdbFilteredJar = tasks.register("rocksdbFilteredJar", Zip) {
    dependsOn configurations.voxyEmbed
    archiveFileName = "rocksdb-filtered-tmp.jar"
    entryCompression = ZipEntryCompression.STORED
    destinationDirectory = layout.buildDirectory.dir("tmp/rocksdbf")
    from { zipTree(configurations.voxyEmbed.getFiles().find { it.name.contains("rocksdbjni") }) }
    exclude { e -> e.name.endsWith(".jnilib") || rocksBad(e.name) }
}

// Relocate org.sqlite.* so the voxy automatic module does not export the same packages
// as other mods that embed sqlite-jdbc (see java.lang.module.ResolutionException on launch).
def relocateSqliteJar = tasks.register("relocateSqliteJar", com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    onlyIf { !isInGHA }
    archiveFileName = "sqlite-jdbc-relocated.jar"
    destinationDirectory = layout.buildDirectory.dir("tmp/relocateSqlite")
    duplicatesStrategy = DuplicatesStrategy.WARN
    from { zipTree(project.configurations.getByName("sqliteToRelocate").singleFile) }
    mergeServiceFiles()
    exclude "module-info.class"
    relocate "org.sqlite", "me.cortex.voxy.shaded.org.sqlite"
}
if (!isInGHA) {
    tasks.named("relocateSqliteJar") { dependsOn project.configurations.named("sqliteToRelocate") }
}

// Shadow plugin registers a default shadowJar that fat-jars runtimeClasspath (NeoForge + dev mods).
// Voxy embeds deps via the jar task and relocateSqliteJar instead; disable to avoid resolution/zip64 failures.
tasks.named("shadowJar") { enabled = false }

tasks.named("jar", Jar) {
    dependsOn compileJava21, compileSodiumLegacyJava, rocksdbFilteredJar
    if (!isInGHA) { dependsOn relocateSqliteJar }
    from(sourceSets.java21.output) { into "META-INF/versions/21" }
    from(sourceSets.sodiumLegacy.output)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from { zipTree(rocksdbFilteredJar.get().archiveFile.get().asFile) }
    from {
        configurations.voxyEmbed.getFiles().findAll { f ->
            f.name.contains("redis") || f.name.contains("commons-pool2")
                    || f.name.contains("tukaani") || f.name.startsWith("xz-")
        }.collect { zipTree(it) }
    }
    if (!isInGHA) {
        from { zipTree(relocateSqliteJar.get().archiveFile.get().asFile) }
    }
    // Embed only the LMDB/ZSTD addon JARs (Java bindings + their natives).
    // The base lwjgl jar (and its natives) are intentionally excluded: Minecraft + NeoForge
    // already ship org.lwjgl:lwjgl on the game module path and in java.library.path. Bundling
    // a second copy causes JPMS split-package errors ("Modules voxy and org.lwjgl export
    // package org.lwjgl.system.windows to module mixinextras.neoforge"). The filter below
    // accepts only files whose name contains "lmdb" or "zstd", which skips the base lwjgl jar
    // and its native jar even when they appear transitively in the voxyEmbed configuration.
    // module-info.class is excluded as an extra safety net.
    from({
        configurations.voxyEmbed.getFiles().findAll { f ->
            f.name.contains("lwjgl") && !f.name.contains("sources") && !f.name.contains("javadoc") &&
                (f.name.contains("lmdb") || f.name.contains("zstd"))
        }.collect { zipTree(it) }
    }) {
        exclude "module-info.class"
    }

    manifest { attributes "Multi-Release": "true" }
    if (file("LICENSE").exists()) { from("LICENSE") { rename { f -> "${f}_${archives_base_name}" } } }
    if (!isInGHA) {
        doFirst {
            def h = gitCommitHash()
            if (h != "<UnknownCommit>") { archiveClassifier = h }
        }
    }
}

publishing {
    publications { register("mavenJava", MavenPublication) { from components.java } }
    repositories { maven { url = "file://${project.projectDir}/repo" } }
}
idea { module { downloadSources = true; downloadJavadoc = true } }